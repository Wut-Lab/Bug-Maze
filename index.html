<script>
(()=>{const s=document.getElementById('stage'),b=document.getElementById('bug'),cv=document.createElement('canvas'),x=cv.getContext('2d');
cv.style.cssText='position:absolute;inset:0;width:100%;height:100%;pointer-events:none';s.prepend(cv);
let n=3,w,cw,ch,R,S,p,g=null,drag=false,ang=0,won=false,sp,got,bd=null,fd=null,lastStep=0,lastBump=0;
const BM=window.BugMaze,fl=document.getElementById('flower'),bu=document.getElementById('buddy'),to=document.getElementById('toast'),st=document.getElementById('star'),pk=document.getElementById('pick'),sh=document.querySelectorAll('#sh stop');
const COL={Red:['#ff7a5c','#e8402f','#9e1f14'],Blue:['#7ab8ff','#2f7de8','#14449e'],Yellow:['#fff27a','#f2c81f','#a8820a'],Pink:['#ffb3d6','#ff6fae','#b8336f'],Orange:['#ffb066','#f57c1f','#a84a0a'],Purple:['#c99bff','#8e4fe0','#53209e']};
const sw=document.getElementById('swatches');Object.entries(COL).forEach(([k,c])=>{const t=document.createElement('button');t.setAttribute('aria-label',k);t.style.background=`radial-gradient(circle at 35% 30%,${c[0]},${c[1]} 55%,${c[2]})`;
t.onclick=e=>{e.stopPropagation();BM.Sound.play('tap');c.forEach((v,i)=>sh[i].setAttribute('stop-color',v));BM.data.color=k;BM.save();pk.hidden=true;drag=false;g=null};sw.appendChild(t)});
if(BM.data.color&&COL[BM.data.color])COL[BM.data.color].forEach((v,i)=>sh[i].setAttribute('stop-color',v));
const say=t=>{to.textContent=t;to.classList.add('on');clearTimeout(say.t);say.t=setTimeout(()=>to.classList.remove('on'),2200)};
fl.addEventListener('pointerdown',e=>{e.stopPropagation();if(!fd||fl.classList.contains('awake'))return;BM.Sound.play('flower');const F=BM.data.flowers||{};say(F[fd.id]?'WOW!':'You found a '+fd.name+'!');F[fd.id]=true;BM.data.flowers=F;BM.data.flowersCaught=(BM.data.flowersCaught||0)+1;BM.save();fl.classList.add('awake')});
const party=(px,py)=>{for(let i=0;i<18;i++){const d=document.createElement('i'),a=i/18*6.283,r=R*(2.5+Math.random()*2);d.className='conf';d.textContent=i%3?'':'❤';
d.style.cssText=`left:${px}px;top:${py}px;--dx:${Math.cos(a)*r}px;--dy:${Math.sin(a)*r}px;--c:${['#ff6fae','#ffd23f','#4fd16a','#6ec6ff','#e8402f','#9a5ae8'][i%6]}`;s.appendChild(d);setTimeout(()=>d.remove(),1200)}};
const pick=()=>{pk.hidden=false;drag=false;g=null};
function make(n){const w=[...Array(n*n)].map(()=>[1,1,1,1]),v=new Set([0]),st=[0],D=[[0,-1,0,2],[1,0,1,3],[0,1,2,0],[-1,0,3,1]];
while(st.length){const i=st[st.length-1],cx=i%n,cy=i/n|0,o=D.filter(([dx,dy])=>{const a=cx+dx,c=cy+dy;return a>=0&&c>=0&&a<n&&c<n&&!v.has(c*n+a)});
if(!o.length){st.pop();continue}const[dx,dy,k,t]=o[Math.random()*o.length|0],j=(cy+dy)*n+cx+dx;w[i][k]=0;w[j][t]=0;v.add(j);st.push(j)}return w}
const lfs=[Object.assign(new Image(),{src:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="l" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#b6ef6a"/><stop offset=".55" stop-color="#5cbf2e"/><stop offset="1" stop-color="#2c7a16"/></radialGradient></defs><g stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 182 V196" fill="none"/><path d="M100 182 C30 160 28 70 100 14 C172 70 170 160 100 182Z" fill="url(#l)"/><path d="M100 176 V40 M100 140 L70 112 M100 140 L130 112 M100 104 L76 82 M100 104 L124 82" fill="none" stroke-width="4" stroke="#2c6a16"/></g><ellipse cx="74" cy="90" rx="10" ry="26" fill="#fff" opacity=".45" transform="rotate(20 74 90)"/></svg>`),onload:()=>{if(w&&lf)init()}}),Object.assign(new Image(),{src:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="l" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#b6ef6a"/><stop offset=".55" stop-color="#5cbf2e"/><stop offset="1" stop-color="#2c7a16"/></radialGradient></defs><g stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 178 V196" fill="none"/><path d="M100 178 L92 150 L50 162 L60 136 L22 118 L44 108 L30 78 L64 86 L70 62 L90 80 L100 22 L110 80 L130 62 L136 86 L170 78 L156 108 L178 118 L140 136 L150 162 L108 150Z" fill="url(#l)"/><path d="M100 170 V52 M100 140 L52 110 M100 140 L148 110 M100 110 L70 84 M100 110 L130 84" fill="none" stroke-width="4" stroke="#2c6a16"/></g><ellipse cx="76" cy="104" rx="8" ry="18" fill="#fff" opacity=".45" transform="rotate(40 76 104)"/></svg>`),onload:()=>{if(w&&lf)init()}}),Object.assign(new Image(),{src:'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><defs><radialGradient id="l" cx=".35" cy=".3" r=".85"><stop offset="0" stop-color="#b6ef6a"/><stop offset=".55" stop-color="#5cbf2e"/><stop offset="1" stop-color="#2c7a16"/></radialGradient></defs><g stroke="#2b2b2b" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M100 176 V196" fill="none"/><path d="M100 176 C40 150 14 100 40 58 C60 28 92 40 100 62 C108 40 140 28 160 58 C186 100 160 150 100 176Z" fill="url(#l)"/><path d="M100 170 V68 M100 140 L64 110 M100 140 L136 110 M100 108 L70 78 M100 108 L130 78" fill="none" stroke-width="4" stroke="#2c6a16"/></g><ellipse cx="62" cy="80" rx="9" ry="20" fill="#fff" opacity=".45" transform="rotate(35 62 80)"/></svg>`),onload:()=>{if(w&&lf)init()}})];let lf=null;
function init(){const W=cv.width=s.clientWidth,Hh=cv.height=s.clientHeight;cw=W/n;ch=Hh/n;lf=lfs[Math.random()*3|0];R=Math.min(cw,ch)*.3;S=R*2.4;w=make(n);
b.setAttribute('width',S);b.setAttribute('height',S);p={x:cw/2,y:ch/2};g=null;won=false;
const k=1+Math.random()*(n*n-2)|0;bd=null;bu.className='';bu.style.display='none';
const de=w.map((q,i)=>i).filter(i=>i&&i!=n*n-1&&i!=k&&w[i].reduce((a,v)=>a+v,0)==3);
if(de.length&&Math.random()<1/3){const F=BM.data.buddies||{},all=BM.Buddies,pool=all,c=de[Math.random()*de.length|0],Z=R*2.3;
bd={...pool[Math.random()*pool.length|0],x:(c%n+.5)*cw,y:((c/n|0)+.5)*ch};bu.innerHTML=bd.svg;bu.className=F[bd.id]?'seen':'';bu.style.cssText=`display:block;width:${Z}px;height:${Z}px;left:${bd.x-Z/2}px;top:${bd.y-Z/2}px`}sp={x:(k%n+.5)*cw,y:((k/n|0)+.5)*ch};got=false;const Z=R*1.8;st.style.cssText+=`;display:block;width:${Z}px;height:${Z}px;left:${sp.x-Z/2}px;top:${sp.y-Z/2}px`;
const sg=[];
w.forEach((q,i)=>{const a=i%n*cw,c=(i/n|0)*ch;if(q[0])sg.push([a,c,a+cw,c]);if(q[1])sg.push([a+cw,c,a+cw,c+ch]);if(q[2])sg.push([a,c+ch,a+cw,c+ch]);if(q[3])sg.push([a,c,a,c+ch])});
const lw=Math.min(cw,ch)*.14,ws=BM.Walls.styles;BM.Walls.draw(x,sg,lw,ws[Math.random()*ws.length|0]);
fl.className='';fl.style.display='none';fd=null;const inn=sg.filter(([a,c,e,f])=>!(a==e&&(a<1||a>W-1)||c==f&&(c<1||c>Hh-1)));
if(inn.length&&Math.random()<.2){const [a,c,e,f]=inn[Math.random()*inn.length|0],F=BM.data.flowers||{},Z=R*2;fd=BM.Flowers[Math.random()*BM.Flowers.length|0];fl.innerHTML=fd.svg;fl.className=F[fd.id]?'seen':'new';fl.style.cssText=`display:block;width:${Z}px;height:${Z}px;left:${(a+e)/2-Z/2}px;top:${(c+f)/2-Z*.75}px`}
const L=R*2.6;x.save();x.translate(W-cw/2,Hh-ch/2);x.rotate(-.35);x.drawImage(lf,-L/2,-L/2,L,L);x.restore()}
function ok(X,Y){const i=Math.min(n-1,X/cw|0),j=Math.min(n-1,Y/ch|0),q=w[j*n+i],m=R*.9,lx=X-i*cw,ly=Y-j*ch,ex=lx<m||lx>cw-m,ey=ly<m||ly>ch-m;
return X>0&&Y>0&&!(q[0]&&ly<m||q[2]&&ly>ch-m||q[3]&&lx<m||q[1]&&lx>cw-m||ex&&ey)}
function step(){if(g&&!won){const dx=g.x-p.x,dy=g.y-p.y,L=Math.hypot(dx,dy);
if(L>3){const v=Math.min(L,drag?8:4),nx=p.x+dx/L*v,ny=p.y+dy/L*v,ox=p.x,oy=p.y,T=performance.now();if(ok(nx,p.y))p.x=nx;if(ok(p.x,ny))p.y=ny;const mv=Math.hypot(p.x-ox,p.y-oy);
if(mv<v*.3){if(T-lastBump>450){lastBump=T;BM.Sound.play('bump')}if(!drag)g=null}else if(T-lastStep>230){lastStep=T;BM.Sound.play('step')}ang=Math.atan2(dx,-dy)*180/Math.PI;b.classList.add('walk')}else{if(!drag)g=null;b.classList.remove('walk')}}
else b.classList.remove('walk');
if(bd&&!bd.found&&Math.hypot(p.x-bd.x,p.y-bd.y)<R*1.6){bd.found=true;bu.classList.add('awake');BM.Sound.play('buddy');const F=BM.data.buddies||{};say(F[bd.id]?'WOW!':'You found '+bd.name+'!');F[bd.id]=true;BM.data.buddies=F;BM.data.buddiesCaught=(BM.data.buddiesCaught||0)+1;BM.save()}
if(!got&&Math.hypot(p.x-sp.x,p.y-sp.y)<R*1.3){got=true;st.style.display='none';BM.Sound.play('star');BM.data.stars=(BM.data.stars||0)+1;BM.save();BM.showStars()}
if(!won&&Math.hypot(p.x-(cw*(n-.5)),p.y-(ch*(n-.5)))<R*1.4){won=true;b.classList.remove('walk');BM.Sound.play('leaf');BM.Sound.play('yay');b.classList.add('yay');party(p.x,p.y);setTimeout(()=>{b.classList.remove('yay');n=Math.min(6,n+1);init();pick()},1500)}
b.style.left=p.x-S/2+'px';b.style.top=p.y-S/2+'px';b.style.transform='rotate('+ang+'deg)';requestAnimationFrame(step)}
const pt=e=>{const r=s.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}};init();window.newMaze=()=>{n=3;document.getElementById('menu').hidden=true;s.hidden=false;init();pick()};document.getElementById('home').onclick=e=>{e.stopPropagation();s.hidden=true;document.getElementById('menu').hidden=false;BM.showStars()};addEventListener('resize',()=>{if(!s.hidden)init()});

s.addEventListener('pointerup',()=>{drag=false});step()})();

@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&display=swap');
#menu h2{margin:0 0 8px;text-align:center;align-self:center;font:700 3.2rem 'Fredoka',system-ui;letter-spacing:2px;transform:rotate(-3deg);paint-order:stroke fill;z-index:2;color:transparent;background:repeating-linear-gradient(100deg,#2e7d1a 0 3px,#5fbf2f 3px 6px,#3c9a22 6px 8px),linear-gradient(#a5e05a,#2f6b1f);background-blend-mode:multiply;-webkit-background-clip:text;background-clip:text;-webkit-text-stroke:3px #173d0c;filter:drop-shadow(2px 0 0 #fff) drop-shadow(-2px 0 0 #fff) drop-shadow(0 2px 0 #fff) drop-shadow(0 -2px 0 #fff) drop-shadow(0 5px 0 #173d0c) drop-shadow(0 8px 6px #0005)}
#menu h2 .e{position:relative;display:inline-block}
#menu h2 .tb{position:absolute;width:26px;height:26px;left:55%;top:-12px;transform:rotate(35deg)}
.mbtn{z-index:2;width:200px;padding:14px;font:800 1.3rem system-ui;color:#fff;border:0;border-radius:22px;cursor:pointer;background:linear-gradient(#ff6b6b,#d32f2f);box-shadow:0 7px 0 #8e1b1b,0 10px 12px #0004;transition:transform .08s,box-shadow .08s}
.mbtn.g{background:linear-gradient(#ffd54f,#f9a825);box-shadow:0 7px 0 #a86f00,0 10px 12px #0004}
.mbtn.b{background:linear-gradient(#64b5f6,#1976d2);box-shadow:0 7px 0 #0d4a8f,0 10px 12px #0004}
.mbtn:active,.mbtn.p{transform:translateY(6px) scale(.97);box-shadow:0 1px 0 #0006,0 2px 4px #0004}
.mbtn:focus-visible{outline:4px solid #fff}
.mb,.mi{position:absolute;left:0;top:0;z-index:1;cursor:pointer;touch-action:none}
.mi{animation:popin .4s cubic-bezier(.3,1.6,.5,1)}.mi.bye{animation:popout .4s forwards}
.critter.wig{animation:wig .5s ease-in-out}.mi.wig{animation:wig .5s ease-in-out}
@keyframes wig{20%{rotate:-14deg}40%{rotate:12deg}60%{rotate:-8deg}80%{rotate:5deg}}
@keyframes popin{from{scale:0}}@keyframes popout{to{scale:0;opacity:0}}
#menu .mbtn,#menu #score{transition:opacity .35s,filter .35s,transform .08s,box-shadow .08s}
#menu.faded .mbtn,#menu.faded #score{opacity:.3;filter:saturate(.4)}
.mb .a,.mb .b{transform-origin:100px 125px}.mb.walk .a{animation:sw .2s infinite alternate}.mb.walk .b{animation:sw .2s infinite alternate-reverse}
</style>
<h2>Ladybug Maz<span class="e">e</span></h2>
<div id="score" aria-live="polite">⭐ Stars Collected: <span id="stars">0</span></div>
<button class="mbtn">▶ Play</button>
<button class="mbtn g">★ Collections</button>
<button class="mbtn b">♥ Credits</button>
</div>
<script>
(()=>{const M=document.getElementById('menu');
const uid=(v,k)=>v.replace(/id="/g,'id="'+k+'-').replace(/url\(#/g,'url(#'+k+'-');BugMaze.uid=uid;
function book(t){const B=t=='b',F=(B?BugMaze.data.buddies:BugMaze.data.flowers)||{},L=B?BugMaze.Buddies:BugMaze.Flowers;
document.querySelectorAll('#tabs button').forEach(q=>q.setAttribute('aria-selected',q.dataset.t==t));
document.getElementById('book').innerHTML=L.map(q=>`<div class="${F[q.id]?'':'no'}">${uid(q.svg,'bk')}${F[q.id]?(B?q.name.split(' ')[0]:q.name):'?'}</div>`).join('');
{const c=(B?BugMaze.data.buddiesCaught:BugMaze.data.flowersCaught)||0;document.getElementById('coll-c').textContent=(B?'Buddies':'Flowers')+' Found: '+(c>9999?'9999+':c)}
document.getElementById('coll-n').textContent=`Collected ${L.filter(q=>F[q.id]).length} of ${L.length}. `+(B?'Look in the dead ends!':'Tap flowers on the walls!')}
document.addEventListener('click',e=>{const q=e.target.closest('#tabs button');if(q){BugMaze.Sound.play('tap');book(q.dataset.t)}});document.addEventListener('click',e=>{if(e.target.id=='coll-x'){BugMaze.Sound.play('tap');document.getElementById('coll').classList.add('hidden')}});BugMaze.showStars=()=>document.getElementById('stars').textContent=BugMaze.data.stars||0;BugMaze.showStars();
const tap=()=>BugMaze.Sound.play('tap');
{const t=document.getElementById('bug').cloneNode(true);t.removeAttribute('id');t.removeAttribute('style');t.setAttribute('class','tb');t.setAttribute('aria-hidden','true');M.querySelector('h2 .e').appendChild(t)}
M.querySelectorAll('.mbtn').forEach(b=>b.onclick=()=>{tap();if(b.textContent.includes('Play'))setTimeout(()=>newMaze(),150);if(b.textContent.includes('Collections')){book('b');document.getElementById('coll').classList.remove('hidden')}b.classList.add('p');setTimeout(()=>b.classList.remove('p'),120)});
BugMaze.MenuCritters.start(M);
// Playing with the grass fades the buttons out of the way (and switches them off). Tapping a faded button brings them back.
const fade=on=>M.classList.toggle('faded',on);
M.addEventListener('pointerdown',e=>{if(!e.target.closest('.mbtn,#score,h2'))fade(true)});
M.addEventListener('click',e=>{if(!M.classList.contains('faded')||!e.target.closest('.mbtn,#score'))return;e.stopPropagation();e.preventDefault();fade(false);tap()},{capture:true});
})();
</script>
<div id="coll" class="overlay hidden top-overlay" role="dialog" aria-modal="true" aria-labelledby="coll-t"><div class="pad-card"><h2 id="coll-t">Collections</h2><div id="tabs" role="tablist"><button role="tab" data-t="b">🐞 Bug Buddies</button><button role="tab" data-t="f">🌷 Flowers</button></div><div id="coll-c" class="tally"></div><p class="pad-text" id="coll-n"></p><div id="book"></div><button id="coll-x" class="btn btn-small">Done</button></div></div>
<button id="music" class="icon-btn" aria-label="Music on/off">🎵</button>
<script>(()=>{const BM=BugMaze,m=document.getElementById('music'),show=()=>{m.textContent=BM.data.music?'🎵':'🔇';m.setAttribute('aria-pressed',BM.data.music)};show();
m.onclick=e=>{e.stopPropagation();BM.data.music=!BM.data.music;BM.save();BM.data.music?BM.Music.start():BM.Music.stop();show()};
addEventListener('pointerdown',()=>{if(BM.data.music)BM.Music.start()},{once:true})})()</script>
<button id="btn-fullscreen" class="icon-btn fs-btn" aria-label="Full screen"></button>
    <!-- Full screen options (grown-up choice) -->
    <div id="fs-menu" class="overlay hidden top-overlay" role="dialog" aria-modal="true" aria-labelledby="fs-title">
      <div class="pad-card">
        <h2 id="fs-title">Full screen</h2>
        <p class="pad-text">Dad Lock keeps little hands in the game: leaving full screen needs a grown-up PIN.</p>
        <div class="fs-choices">
          <button id="fs-locked" class="btn btn-play">🔒 Full screen + Dad Lock</button>
          <button id="fs-plain" class="btn btn-small">Just full screen</button>
          <button id="fs-cancel" class="link-btn">Cancel</button>
        </div>
      </div>
    </div>

    <!-- PIN keypad / lock screen -->
    <div id="pad" class="overlay hidden top-overlay" role="dialog" aria-modal="true" aria-labelledby="pad-title">
      <div class="pad-card">
        <h2 id="pad-title">Grown-ups only</h2>
        <p id="pad-msg" class="pad-text" aria-live="polite"></p>
        <div id="pad-dots" class="pad-dots"></div>
        <div id="pad-keys" class="pad-keys"></div>
        <div class="pad-actions">
          <button id="pad-resume" class="btn btn-play">Back to full screen</button>
          <button id="pad-cancel" class="btn btn-small">Cancel</button>
          <button id="pad-forgot" class="link-btn">Forgot PIN?</button>
        </div>
      </div>
    </div>
<script src="js/dadlock.js"></script>
<script>BugMaze.DadLock.init(BugMaze.data)</script>
</body></html>
